<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #e5e5e4, #edf2f3);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .welcome-box {
            background-color: rgb(213, 215, 219);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
        }

        h1 {
            color: #0e0c0c;
        }

        p {
            color: #0b0a0a;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background-color: #241f50;
            color: rgba(165, 161, 161, 0.563);
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        a:hover {
            background-color: #151757;
        }
    </style>
</head>
<body>
    <div class="welcome-box">
        <h1>Welcome to Our Website</h1>
        <h2>Hello Sign In </h2>
        
        <p>Please log in to continue</p>
        <a href="sigup.html">Go to Login</a>

        
    </div>
</body>
</html>
